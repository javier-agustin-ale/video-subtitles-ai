kind = "web"
previewPath = "/"
title = "AI Subtitle Adder"
version = "1.0.0"
id = "artifacts/subtitle-adder"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23182

[services.development]
run = "pnpm --filter @workspace/subtitle-adder run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/subtitle-adder", "run", "build" ]
publicDir = "artifacts/subtitle-adder/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23182"
BASE_PATH = "/"
